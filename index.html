const defaults={brands:[{id:'lumi',name:'Lumi Lentes',description:'Ótica e lentes de contato',color:'#7939e9',emoji:'👓',platforms:['Instagram','TikTok','Facebook'],frequency:'3x/semana',active:true},{id:'megao',name:'Megão Saldão',description:'Móveis, eletrônicos e utilidades',color:'#ffcb27',emoji:'🛍️',platforms:['Instagram','Facebook','TikTok'],frequency:'5x/semana',active:true}],posts:[],materials:[],metrics:{}};
const safeJson=(s,f)=>{try{return JSON.parse(s)||f}catch{return f}};let db=safeJson(localStorage.getItem('megao-marketing-v2'),structuredClone(defaults));if(!Array.isArray(db.brands))db=structuredClone(defaults);let ui={page:'home',brand:null,filter:'all',tab:'Resumo',creativeTab:'Já Publicados',calendarMode:'semana',weekStart:new Date(),editId:null,modal:null,uploadData:null,installPrompt:null,installed:(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('megao-marketing-v2',JSON.stringify(db));const brand=id=>db.brands.find(b=>b.id===id)||db.brands[0];const color=id=>brand(id)?.color||'#7135ec';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});const today=()=>new Date().toLocaleDateString('en-CA');const navs=[['home','Início','<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>'],['calendar','Calendário','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'],['creative','Criativos','<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m21 16-6-6L5 21"/>'],['reports','Relatórios','<path d="M4 20v-5M10 20V8M16 20V4M22 20v-12"/>']];
function go(page,opt={}){ui.page=page;Object.assign(ui,opt);ui.modal=null;render();window.scrollTo(0,0)}function nav(){return '<nav class="nav">'+navs.map(([p,n,svg])=>`<button aria-label="${n}" class="${ui.page===p||p==='home'&&ui.page==='brand'?'active':''}" onclick="go('${p}')"><svg viewBox="0 0 24 24">${svg}</svg>${n}</button>`).join('')+'</nav>'}function options(selected,includeAll=true){return (includeAll?'<option value="all">Todos os estabelecimentos</option>':'')+db.brands.map(b=>`<option value="${esc(b.id)}" ${selected===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}function bt(text,fn,cls='primary'){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}function pillFilter(){return `<div class="pills"><button class="pill ${ui.filter==='all'?'active':''}" onclick="ui.filter='all';render()">Todos</button>`+db.brands.map(b=>`<button class="pill ${ui.filter===b.id?'active':''}" onclick="ui.filter='${b.id}';render()"><span style="color:${esc(b.color)}">●</span> ${esc(b.name)}</button>`).join('')+'</div>'}function filtered(list){return list.filter(v=>ui.filter==='all'||v.brandId===ui.filter)}function sortedPosts(){return [...db.posts].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}function cardPost(p){let b=brand(p.brandId);return `<article class="card schedule" style="--brand:${esc(b.color)}"><div class="datebox">${esc(new Date(p.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}))}<b>${fmt(p.date)}</b></div><div class="schedule-info"><div class="row space"><b style="font-size:13px">${esc(b.name)}</b><span class="tag">${esc(p.status)}</span></div><div class="small muted">◷ ${esc(p.time)} · ${esc(p.platform)} · ${esc(p.type)}</div><b style="display:block;margin-top:7px">${esc(p.title)}</b><div class="small muted">${esc(p.caption).slice(0,86)}</div></div><button class="link" aria-label="Editar publicação" onclick="openPost('${p.id}')">✎</button></article>`}function installBanner(){if(ui.installed)return '';return `<div class="install-spot" role="group" aria-label="Instalação no celular"><span class="install-spot-icon">⬇</span><span class="install-spot-copy"><b>Vinnyzau no celular</b>Instale pelo navegador após publicar em HTTPS.</span><button type="button" id="installBtn" class="install-cta" onclick="installApp()">⬇ Instalar</button></div>`}
function installHelp(){
 const secure=location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
 const ios=/iP(ad|hone|od)/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
 const android=/Android/i.test(navigator.userAgent);
 const inapp=/Instagram|FBAN|FBAV|GSA|TikTok|Line\//i.test(navigator.userAgent);
 const intro=!secure?`<div class="install-hint"><b>⚠ Para instalar:</b> o app precisa estar publicado em um endereço HTTPS. O arquivo HTML baixado e aberto pelo gerenciador de arquivos não pode instalar um PWA. Publique a pasta do aplicativo na Vercel e acesse o link.</div>`:'';
 let steps;
 if(ios){steps=[`Abra o link publicado em <b>Safari</b> (não no navegador interno de outro aplicativo).`,`Toque em <b>Compartilhar</b> — ícone de quadrado com uma seta para cima.`,`Escolha <b>Adicionar à Tela de Início</b> e confirme em <b>Adicionar</b>.`];}
 else if(android){steps=[`Abra o link publicado no <b>Google Chrome</b> ou navegador compatível.`,`Toque no menu <b>⋮</b> do navegador.`,`Escolha <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b> e confirme.`];}
 else {steps=[`Abra o link publicado em <b>Chrome ou Edge</b> no computador, ou no navegador principal do celular.`,`Use o ícone de instalação na barra de endereço, se disponível.`,`No celular, abra o menu do navegador e procure <b>Instalar aplicativo</b> / <b>Adicionar à tela inicial</b>.`];}
 const warning=inapp?`<div class="install-hint">Você parece estar usando um navegador dentro de outro aplicativo. Abra este link diretamente no Chrome (Android) ou Safari (iPhone).</div>`:'';
 return `<div class="modal install-modal" role="dialog" aria-modal="true" aria-label="Instalação do Vinnyzau"><div class="row space"><h2>📲 Instalar Vinnyzau</h2><button class="back" aria-label="Fechar" onclick="closeModal()">×</button></div><p class="install-info">O aplicativo pode ficar na tela inicial do celular, sem precisar de uma loja de aplicativos. Siga estes passos:</p>${intro}${warning}${steps.map((step,i)=>`<div class="install-step"><span class="install-step-num">${i+1}</span><div>${step}</div></div>`).join('')}<p class="install-info"><b>Observação:</b> instalar o app não transforma esta versão em APK nem sincroniza os dados entre aparelhos.</p><button type="button" class="btn primary full" onclick="closeModal()">Entendi</button></div>`;
}
function home(){return `<header class="hero"><p class="eyebrow">SEU ESTÚDIO CRIATIVO ✨</p><h1 class="h1">Vinnyzau</h1><p class="muted no-margin">Seus estabelecimentos em um só lugar</p></header>${bt('＋ Novo Estabelecimento',"showModal('brand')",'sun full')}${installBanner()}<div class="section-head"><h2>Meus estabelecimentos</h2><span class="tiny-count">${db.brands.length} marcas</span></div>`+db.brands.map(b=>{let posts=db.posts.filter(p=>p.brandId===b.id).sort((a,c)=>(a.date+a.time).localeCompare(c.date+c.time));let next=posts.find(p=>p.date>=today()&&p.status!=='Publicado');let last=[...posts].reverse().find(p=>p.status==='Publicado');let count=db.materials.filter(m=>m.brandId===b.id).length;return `<button class="brand-card" style="background:${esc(b.color)};color:${b.color==='#ffcb27'?'#1d1746':'white'}" onclick="go('brand',{brand:'${b.id}',tab:'Resumo'})"><span class="brand-avatar">${esc(b.emoji)}</span><span class="brand-body"><span class="brand-name">${esc(b.name)}</span><div class="brand-detail">${esc(b.description)}</div><span class="brand-status">${next?'Próximo: '+fmt(next.date)+' às '+next.time:last?'Último: '+fmt(last.date):count+' materiais · Sem post programado'}</span></span><span class="dots">›</span></button>`}).join('')}
function brandPage(){let b=brand(ui.brand);let posts=sortedPosts().filter(p=>p.brandId===b.id);let upcoming=posts.filter(p=>p.status!=='Publicado').slice(0,3);return `<div class="row space"><div class="row"><button class="back" onclick="go('home')">‹</button><div><h1 class="h1" style="font-size:24px">${esc(b.emoji)} ${esc(b.name)}</h1><div class="small muted">${esc(b.description)}</div></div></div><button class="btn ghost smallbtn" onclick="showModal('brand','${b.id}')">⚙</button></div><div class="tabs">${['Resumo','Posts','Criativos','Métricas'].map(t=>`<button class="tab ${ui.tab===t?'active':''}" style="${ui.tab===t?'--brand:'+b.color:''}" onclick="ui.tab='${t}';render()">${t}</button>`).join('')}</div>`+(ui.tab==='Resumo'?`<section class="card" style="background:linear-gradient(125deg,${esc(b.color)},#a13de7);color:#fff"><div class="h2" style="margin:0">${esc(b.emoji)} ${esc(b.name)}</div><p>Plataformas: ${esc(b.platforms.join(' • '))}</p><p>🗓 Frequência: ${esc(b.frequency)}</p><p>● Status: ${b.active?'Ativo':'Inativo'}</p></section><div class="section-head"><h2>Próximos Posts</h2><button class="link" onclick="ui.tab='Posts';render()">Ver todos ›</button></div>${upcoming.length?upcoming.map(cardPost).join(''):'<div class="empty">Nenhum post pendente. Comece criando um novo.</div>'}${bt('＋ Agendar Novo Post',`openPost(null,'${b.id}')`,'primary full')}<div class="section-head"><h2>Últimos Publicados</h2></div>${posts.filter(p=>p.status==='Publicado').slice(-3).reverse().map(cardPost).join('')||'<div class="empty">Nenhum post publicado cadastrado.</div>'}`:ui.tab==='Posts'?`${bt('＋ Novo Post',`openPost(null,'${b.id}')`,'primary full')}${posts.map(cardPost).join('')||'<div class="empty">Ainda não há posts.</div>'}`:ui.tab==='Criativos'?creativeContent(b.id):reportsContent(b.id))}
function calendar(){let posts=filtered(sortedPosts());let d=new Date(ui.weekStart);if(!Number.isFinite(d.getTime()))d=new Date();let day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));let days=Array.from({length:7},(_,i)=>{let v=new Date(d);v.setDate(d.getDate()+i);return v});return `<div class="top-actions"><h1 class="h1">Calendário 📅</h1>${bt('＋ Nova Tarefa','openPost()','primary smallbtn')}</div><p class="muted">Organize suas campanhas e publicações.</p>${pillFilter()}<div class="card"><div class="row space"><button class="link" onclick="shiftWeek(-7)">‹ Anterior</button><b>${days[0].toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="link" onclick="shiftWeek(7)">Próxima ›</button></div><div class="week">${days.map((v,i)=>{let date=v.toLocaleDateString('en-CA'),is=today()===date,has=posts.some(p=>p.date===date);return `<button class="day ${is?'sel':''}" onclick="ui.calendarDate='${date}';render()" style="${ui.calendarDate===date?'outline:2px solid #7135ec':''}">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}<b>${v.getDate()}</b><span style="color:${has?'#faad24':'transparent'}">●</span></button>`}).join('')}</div></div><section class="card" style="background:linear-gradient(120deg,#f9e2ff,#eff6ff);border:0"><h2 class="h2" style="margin:0">Planeje, crie, aprove e publique.</h2><p style="margin-bottom:0">Tudo no tempo certo, sem confusão! ✨</p></section><div class="section-head"><h2>Suas postagens</h2><span class="tiny-count">${posts.length} tarefas</span></div>${(ui.calendarDate?posts.filter(p=>p.date===ui.calendarDate):posts).map(cardPost).join('')||'<div class="empty">Não há posts para este filtro ou data.</div>'}${ui.calendarDate?bt('Mostrar todas as datas',"ui.calendarDate=null;render()",'ghost full'):''}${bt('＋ Adicionar Nova Tarefa','openPost()','primary full')}`}
function shiftWeek(n){ui.weekStart.setDate(ui.weekStart.getDate()+n);ui.calendarDate=null;render()}
function creativeContent(bid){let materials=db.materials.filter(m=>(bid?m.brandId===bid:ui.filter==='all'||m.brandId===ui.filter)&&(['Já Publicados','Em Desenvolvimento','Arquivos Salvos'][['Publicado','Desenvolvimento','Salvo'].indexOf(m.status)]===ui.creativeTab));return `<div class="tabs">${['Já Publicados','Em Desenvolvimento','Arquivos Salvos'].map(t=>`<button class="tab ${ui.creativeTab===t?'active':''}" onclick="ui.creativeTab='${t}';render()">${t}</button>`).join('')}</div><div class="gallery">${materials.map(m=>`<button class="tile" onclick="showModal('material','${m.id}')"><div class="tile-visual">${m.data?m.mime.startsWith('image/')?`<img src="${m.data}" alt="${esc(m.title)}">`:'🎬':'🎨'}<span class="overlay-tag">${esc(m.status)}</span></div><div class="tile-footer"><b>${esc(m.title)}</b><div class="muted">${esc(brand(m.brandId).name)} · ${esc(m.date)}</div></div></button>`).join('')}</div>${materials.length?'':'<div class="empty">Ainda não há arquivos nesta categoria.</div>'}<div class="drop"><div style="font-size:32px">☁️</div><b>Selecione arquivos — JPG, PNG ou MP4</b><p class="small muted">Até 50 MB por arquivo. Os arquivos são armazenados neste dispositivo enquanto houver espaço disponível.</p>${bt('＋ Anexar Novo Material',`showModal('upload'${bid?`,'${bid}'`:''})`,'inkbtn')}</div>`}
function creative(){return `<div class="top-actions"><h1 class="h1">Criativos 🎨</h1>${bt('＋ Anexar',"showModal('upload')",'inkbtn smallbtn')}</div><p class="muted">Sua biblioteca visual por estabelecimento</p>${pillFilter()}${creativeContent(null)}`}
function reportsContent(bid){let m=db.metrics[bid]||{followers:0,reach:0,engagement:0,bestTime:'—',bestPost:'—',series:[0,0,0,0,0,0,0]};let series=Array.isArray(m.series)&&m.series.length===7?m.series:[0,0,0,0,0,0,0];let top=Math.max(1,...series);return `<div class="row" style="gap:8px"><div class="stat" style="background:#7135ec;flex:1"><div class="small">Seguidores</div><b>${Number(m.followers).toLocaleString('pt-BR')}</b></div><div class="stat" style="background:#f13697;flex:1"><div class="small">Alcance</div><b>${Number(m.reach).toLocaleString('pt-BR')}</b></div><div class="stat" style="background:#02c5da;flex:1"><div class="small">Engajamento</div><b>${Number(m.engagement).toLocaleString('pt-BR')}</b></div></div><div class="card"><div class="row space"><b>Crescimento de seguidores</b><button class="link" onclick="showModal('metric','${bid}')">✎ Editar</button></div><div class="chart">${series.map(n=>`<span class="bar" style="height:${Math.max(3,n/top*100)}%"></span>`).join('')}</div><div class="chart-legend"><span>Período 1</span><span>Período 7</span></div></div><div class="card" style="background:#fff7db"><h2 class="h2" style="margin:0 0 10px">🏆 Destaques</h2><p>🕗 Melhor horário: <b>${esc(m.bestTime)}</b></p><p>⭐ Conteúdo com mais resultado: <b>${esc(m.bestPost)}</b></p><div class="alert">Métricas preenchidas manualmente. Este app não está integrado às APIs das redes sociais.</div></div>${bt('Atualizar métricas',`showModal('metric','${bid}')`,'primary full')}`}
function reports(){let b=ui.filter==='all'?db.brands[0]:brand(ui.filter);return `<h1 class="h1">Métricas 📊</h1><p class="muted">Acompanhe o desempenho do seu estabelecimento</p><div class="form-field"><label>Estabelecimento</label><select class="input" onchange="ui.filter=this.value;render()">${options(b.id,false)}</select></div>${reportsContent(b.id)}`}
function modalHTML(){if(!ui.modal)return '';let {kind,id}=ui.modal;if(kind==='install')return installHelp();if(kind==='brand'){let b=id?brand(id):{name:'',description:'',color:'#7135ec',emoji:'🏬',platforms:['Instagram'],frequency:'3x/semana',active:true};return `<div class="modal"><div class="row space"><h2>${id?'Editar':'Novo'} estabelecimento</h2><button class="back" onclick="closeModal()">×</button></div><form onsubmit="saveBrand(event,'${id||''}')"><div class="form-field"><label>Nome da marca *</label><input class="input" name="name" required maxlength="45" value="${esc(b.name)}"></div><div class="form-field"><label>Descrição</label><input class="input" name="description" maxlength="100" value="${esc(b.description)}"></div><div class="grid2"><div class="form-field"><label>Cor de identificação</label><input class="input" type="color" name="color" value="${esc(b.color)}" style="height:49px;padding:5px"></div><div class="form-field"><label>Emoji/logotipo</label><input class="input" name="emoji" value="${esc(b.emoji)}" maxlength="4"></div></div><div class="form-field"><label>Plataformas (separadas por vírgula)</label><input class="input" name="platforms" value="${esc(b.platforms.join(', '))}"></div><div class="form-field"><label>Frequência</label><input class="input" name="frequency" value="${esc(b.frequency)}"></div><label><input type="checkbox" name="active" ${b.active?'checked':''}> Estabelecimento ativo</label><div style="height:17px"></div>${bt('Salvar estabelecimento','', 'primary full').replace('onclick=""','type="submit"')}${id?`<button type="button" class="btn full" style="color:#df2857;margin-top:7px" onclick="removeBrand('${id}')">Excluir estabelecimento</button>`:''}</form></div>`}if(kind==='upload'){return `<div class="modal"><div class="row space"><h2>Novo material</h2><button class="back" onclick="closeModal()">×</button></div><form onsubmit="saveMaterial(event)"><div class="form-field"><label>Estabelecimento</label><select class="input" name="brandId">${options(id||db.brands[0]?.id,false)}</select></div><div class="form-field"><label>Título *</label><input class="input" name="title" required></div><div class="form-field"><label>Categoria</label><select class="input" name="status"><option>Desenvolvimento</option><option>Salvo</option><option>Publicado</option></select></div><div class="form-field"><label>Foto ou vídeo</label><input type="file" class="input" id="materialFile" accept="image/jpeg,image/png,video/mp4" required><p class="small muted" id="sizeNote">Imagens são comprimidas para caber no armazenamento local. Vídeos acima do espaço disponível não serão salvos.</p></div><button class="btn primary full" type="submit">Salvar material</button></form></div>`}if(kind==='material'){let m=db.materials.find(m=>m.id===id);if(!m)return '';return `<div class="modal"><div class="row space"><h2>${esc(m.title)}</h2><button class="back" onclick="closeModal()">×</button></div><p>${esc(brand(m.brandId).name)} · ${esc(m.status)}</p><div class="preview">${m.mime.startsWith('image/')?`<img src="${m.data}">`:`<video src="${m.data}" controls style="width:100%;height:100%;object-fit:contain"></video>`}</div><div class="form-field"><label>Mudar status</label><select id="matStatus" class="input"><option ${m.status==='Desenvolvimento'?'selected':''}>Desenvolvimento</option><option ${m.status==='Salvo'?'selected':''}>Salvo</option><option ${m.status==='Publicado'?'selected':''}>Publicado</option></select></div>${bt('Salvar alterações',`updateMaterial('${id}')`,'primary full')}<div class="row space"><button class="link" onclick="reuseMaterial('${id}')">Usar em um post</button><button class="link" style="color:#dc2457" onclick="deleteMaterial('${id}')">Excluir</button></div></div>`}if(kind==='metric'){let m=db.metrics[id]||{followers:0,reach:0,engagement:0,bestTime:'',bestPost:'',series:[0,0,0,0,0,0,0]};return `<div class="modal"><div class="row space"><h2>Métricas · ${esc(brand(id).name)}</h2><button class="back" onclick="closeModal()">×</button></div><form onsubmit="saveMetrics(event,'${id}')">${[['followers','Seguidores','number'],['reach','Alcance','number'],['engagement','Engajamento','number'],['bestTime','Melhor horário','text'],['bestPost','Conteúdo de maior resultado','text'],['series','Seguidores por período (7 valores separados por vírgula)','text']].map(([n,l,t])=>`<div class="form-field"><label>${l}</label><input class="input" name="${n}" type="${t}" ${t==='number'?'min="0"':''} value="${esc(n==='series'?m.series.join(', '):m[n])}"></div>`).join('')}<div class="alert">Insira apenas dados reais obtidos das suas redes sociais.</div><br><button type="submit" class="btn primary full">Salvar métricas</button></form></div>`}return ''}
function openPost(id=null,bid){ui.editId=id;ui.postBrand=bid||(ui.filter==='all'?db.brands[0]?.id:ui.filter);go('editor')}
function editor(){let p=db.posts.find(x=>x.id===ui.editId)||{brandId:ui.postBrand||db.brands[0]?.id,platform:'Instagram',date:today(),time:'10:00',status:'Rascunho',type:'Post Feed',title:'',caption:'',hashtags:'',media:''};return `<div class="row"><button class="back" onclick="go('calendar')">‹</button><div><h1 class="h1" style="font-size:27px">${ui.editId?'Editar':'Novo'} Post</h1><div class="muted small">Organize todos os detalhes do conteúdo</div></div></div><form id="postForm" onsubmit="savePost(event)"><div class="form-field"><label>Estabelecimento</label><select class="input" name="brandId" id="postBrand" onchange="$('postBrand').style.borderColor=color(this.value)">${options(p.brandId,false)}</select></div><div class="grid2"><div class="form-field"><label>Plataforma</label><select class="input" name="platform">${['Instagram','TikTok','Facebook','YouTube','Pinterest','Outros'].map(x=>`<option ${p.platform===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label>Tipo</label><select class="input" name="type">${['Post Feed','Story','Reel','Vídeo','Carrossel','Outro'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label>Data</label><input class="input" type="date" name="date" value="${esc(p.date)}" required></div><div class="form-field"><label>Horário</label><input class="input" type="time" name="time" value="${esc(p.time)}" required></div></div><div class="form-field"><label>Status</label><select class="input" name="status">${['Rascunho','Aguardando Aprovação','Programado','Publicado'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label>Assunto do post *</label><input class="input" name="title" value="${esc(p.title)}" placeholder="Ex.: Promoção Relâmpago" required maxlength="100"></div><div class="form-field"><label>Prévia da imagem</label><div class="preview" id="postPreview">${p.media?`<img src="${p.media}">`:'🎨<br>Seu criativo aqui'}</div><input class="input" type="file" accept="image/png,image/jpeg" id="postMedia" onchange="previewPostFile(this)"><input type="hidden" name="media" id="mediaValue" value="${p.media||''}"><p class="small muted">Fotos comprimidas e armazenadas neste dispositivo.</p></div><div class="form-field"><label>Legenda</label><textarea class="input" name="caption" rows="5" maxlength="2200" placeholder="Escreva a legenda...">${esc(p.caption)}</textarea></div><div class="form-field"><label>Hashtags</label><input class="input" name="hashtags" value="${esc(p.hashtags)}" placeholder="#marketing #promocao"></div><div class="action-grid"><button type="button" class="btn ghost" onclick="submitPost('Rascunho')">Salvar Rascunho</button><button type="button" class="btn" style="background:#d8ffed;color:#138651" onclick="submitPost('Programado')">✓ Marcar Pronto</button><button type="button" class="btn primary" onclick="submitPost('Aguardando Aprovação')">Enviar para Aprovação</button><button type="button" class="btn" style="background:#ffe8ef;color:#d92759" onclick="deletePost()">Excluir</button></div><p class="alert">Marcar como Programado organiza sua agenda, mas não publica automaticamente nas redes sociais.</p></form>`}
function render(){let content=ui.page==='home'?home():ui.page==='brand'?brandPage():ui.page==='calendar'?calendar():ui.page==='creative'?creative():ui.page==='reports'?reports():editor();$('app').innerHTML=`<div class="inner">${content}</div>${ui.page==='editor'?'':nav()}${modalHTML()?'<div class="modal-root" onclick="if(event.target===this)closeModal()">'+modalHTML()+'</div>':''}`}function showModal(kind,id){ui.modal={kind,id};render()}function closeModal(){ui.modal=null;render()}
function saveBrand(e,id){e.preventDefault();let f=e.target.elements;let v={name:f.namedItem('name').value.trim(),description:f.namedItem('description').value.trim(),color:f.namedItem('color').value,emoji:f.namedItem('emoji').value.trim()||'🏬',platforms:f.namedItem('platforms').value.split(',').map(s=>s.trim()).filter(Boolean),frequency:f.namedItem('frequency').value.trim(),active:f.namedItem('active').checked};if(id)Object.assign(brand(id),v);else db.brands.push({id:'b'+Date.now(),...v});save();closeModal()}function removeBrand(id){if(db.brands.length<2)return alert('Cadastre outro estabelecimento antes de excluir o último.');if(!confirm('Excluir o estabelecimento e todos os seus posts, criativos e métricas?'))return;db.brands=db.brands.filter(b=>b.id!==id);db.posts=db.posts.filter(p=>p.brandId!==id);db.materials=db.materials.filter(m=>m.brandId!==id);delete db.metrics[id];save();ui.filter='all';go('home')}
async function toSmallImage(file,maxW=1200){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let d=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);resolve(d)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida'))};img.src=url})}async function asData(file){return new Promise((r,j)=>{let reader=new FileReader();reader.onload=()=>r(reader.result);reader.onerror=j;reader.readAsDataURL(file)})}async function saveMaterial(e){e.preventDefault();let f=e.target.elements,file=$('materialFile').files[0];if(!file)return;if(file.size>50*1024*1024)return alert('Arquivo acima de 50 MB.');try{let data=file.type.startsWith('image/')?await toSmallImage(file):await asData(file);db.materials.push({id:'m'+Date.now(),brandId:f.namedItem('brandId').value,title:f.namedItem('title').value.trim(),status:f.namedItem('status').value,data,mime:file.type.startsWith('image/')?'image/jpeg':file.type,date:today()});save();ui.filter=f.namedItem('brandId').value;ui.creativeTab=f.namedItem('status').value==='Publicado'?'Já Publicados':f.namedItem('status').value==='Salvo'?'Arquivos Salvos':'Em Desenvolvimento';go('creative')}catch(err){db.materials.pop();alert('Não foi possível salvar: armazenamento do aparelho insuficiente ou arquivo inválido. Experimente um arquivo menor.')}}function updateMaterial(id){let m=db.materials.find(x=>x.id===id);m.status=$('matStatus').value;save();closeModal()}function deleteMaterial(id){if(!confirm('Excluir este material?'))return;db.materials=db.materials.filter(m=>m.id!==id);save();closeModal()}function reuseMaterial(id){let m=db.materials.find(x=>x.id===id);if(!m.mime.startsWith('image/'))return alert('Selecione uma imagem para a prévia.');ui.editId=null;ui.postBrand=m.brandId;ui.pendingMedia=m.data;go('editor');$('mediaValue').value=m.data;$('postPreview').innerHTML=`<img src="${m.data}">`}
function saveMetrics(e,id){e.preventDefault();let f=e.target.elements;let values=f.namedItem('series').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(values.length!==7)return alert('Informe exatamente 7 valores para o gráfico.');db.metrics[id]={followers:+f.namedItem('followers').value,reach:+f.namedItem('reach').value,engagement:+f.namedItem('engagement').value,bestTime:f.namedItem('bestTime').value,bestPost:f.namedItem('bestPost').value,series:values};save();closeModal()}async function previewPostFile(input){let file=input.files[0];if(!file)return;try{let data=await toSmallImage(file);$('mediaValue').value=data;$('postPreview').innerHTML=`<img src="${data}">`}catch{alert('Imagem inválida.')}}function submitPost(status){let f=$('postForm');if(!f.reportValidity())return;f.elements.status.value=status;savePost({preventDefault(){},target:f})}function savePost(e){e.preventDefault();let f=e.target.elements;let p={brandId:f.namedItem('brandId').value,platform:f.namedItem('platform').value,type:f.namedItem('type').value,date:f.namedItem('date').value,time:f.namedItem('time').value,status:f.namedItem('status').value,title:f.namedItem('title').value.trim(),caption:f.namedItem('caption').value,hashtags:f.namedItem('hashtags').value,media:f.namedItem('media').value};let orig=db.posts.find(x=>x.id===ui.editId);if(orig)Object.assign(orig,p);else db.posts.push({id:'p'+Date.now(),...p});try{save();ui.filter='all';go('calendar')}catch{if(!orig)db.posts.pop();alert('Memória local cheia. Tente uma imagem menor.')}}function deletePost(){if(!ui.editId){go('calendar');return}if(!confirm('Excluir este post?'))return;db.posts=db.posts.filter(p=>p.id!==ui.editId);save();go('calendar')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installPrompt=e;if(ui.page==='home')render()});
window.addEventListener('appinstalled',()=>{ui.installed=true;ui.installPrompt=null;if(ui.page==='home')render()});
async function installApp(){
 if(ui.installed)return;
 if(ui.installPrompt){const promptEvent=ui.installPrompt;ui.installPrompt=null;try{await promptEvent.prompt();const outcome=await promptEvent.userChoice;if(outcome?.outcome!=='accepted')showModal('install');else if(ui.page==='home')render();}catch{showModal('install');}}
 else showModal('install');
}
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Instalação offline indisponível:',err));
render();
</script></body></html>
