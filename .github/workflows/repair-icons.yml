name: Corrigir ícones instaláveis Vinnyzau
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_icons.py'
      - '.github/workflows/repair-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/generate_icons.py
      - name: Save fixed icons to main
        shell: bash
        run: |
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(pwa): rebuild valid Vinnyzau installation icons'
            git push origin HEAD:main
          else
            echo 'Icons already valid and unchanged.'
          fi
